name: Tem Razao AdSense Deep Recovery

on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expandir conteudo fino restante
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          TR_WP_PASS: ${{ secrets.TR_WP_PASS }}
          TR_WP_USER: hebergravano@gmail.com
          TR_WP_URL: https://temrazao.com.br
          TR_MIN_PAGE_WORDS: "650"
          TR_MIN_POST_WORDS: "900"
          TR_MAX_EXPAND_ITEMS: "12"
          TR_REWRITE_ATTEMPTS: "1"
        run: python temrazao_expand_thin_content.py
