name: HandyTested — Replace Amazon Affiliate Tag

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use 1 to preview without updating WordPress, 0 to update"
        required: false
        default: "0"

jobs:
  replace-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replace Amazon affiliate tag in HandyTested posts
        env:
          HT_WP_PASS:      ${{ secrets.HT_WP_PASS }}
          HT_AMAZON_TAG:   ${{ secrets.HT_AMAZON_TAG }}
          OLD_AMAZON_TAG:  amazonrev089f-20
          NEW_AMAZON_TAG:  ${{ secrets.HT_AMAZON_TAG }}
          DRY_RUN:         ${{ github.event.inputs.dry_run || '0' }}
        run: python replace_ht_amazon_tag.py
