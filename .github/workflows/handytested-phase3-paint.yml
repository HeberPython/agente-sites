name: HandyTested - Phase 3 Paint Correction

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Review first; apply the single-post correction only after verification"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

jobs:
  paint-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tests
        run: python -m unittest test_handytested_editorial_validator.py test_handytested_phase2.py
      - name: Check article baseline and optionally publish
        env:
          HT_WP_PASS: ${{ secrets.HT_WP_PASS }}
          MODE: ${{ github.event.inputs.mode }}
          BACKUP_DIR: handytested-phase3-paint-backup
        run: python handytested_phase3_paint_release.py
      - name: Preserve article backup
        if: ${{ always() && github.event.inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: handytested-phase3-paint-backup
          path: handytested-phase3-paint-backup/
          retention-days: 30
