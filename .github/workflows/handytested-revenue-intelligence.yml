name: HandyTested Revenue Intelligence Test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-google-data:
    name: Test Search Console and GA4
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google API clients
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth google-api-python-client google-analytics-data

      - name: Test Search Console and GA4
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python handytested_revenue_intelligence.py
