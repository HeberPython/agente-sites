name: Agente de Conteúdo

on:
  schedule:
    # Toda segunda-feira as 09:00 no horario de Brasilia (12:00 UTC).
    # Publica 1 artigo no Obra e Pratica e 1 artigo no Tem Razao.
    - cron: "0 12 * * 1"
  workflow_dispatch:  # Permite rodar manualmente pelo GitHub

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar agente
        env:
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_KEY:     ${{ secrets.UNSPLASH_KEY }}
          OEP_WP_PASS:      ${{ secrets.OEP_WP_PASS }}
          TR_WP_PASS:       ${{ secrets.TR_WP_PASS }}
          HT_WP_PASS:       ${{ secrets.HT_WP_PASS }}
          TARGET_SITES:     obraepratica,temrazao
          ARTICLES_PER_SITE: "1"
          MAX_TOTAL_ARTICLES: "2"
          MAX_UNSPLASH_DOWNLOADS: "2"
          PUBLICATION_INTERVAL_DAYS: "1"
        run: python agente_sites.py
