name: HandyTested - Phase 5 Citation Repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run before release"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, apply]
      post_id:
        description: "Exactly one guarded WordPress post ID"
        required: true
        type: choice
        options: ['20', '143', '59']

jobs:
  citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate Python
        run: python -m py_compile handytested_phase5_citation_repair.py
      - name: Validate and optionally repair four citations
        env:
          HT_WP_PASS: ${{ secrets.HT_WP_PASS }}
          MODE: ${{ github.event.inputs.mode }}
          POST_ID: ${{ github.event.inputs.post_id }}
          BACKUP_DIR: handytested-phase5-citation-backup-${{ github.event.inputs.post_id }}
        run: python handytested_phase5_citation_repair.py
      - name: Preserve pre-write backup
        if: ${{ always() && github.event.inputs.mode == 'apply' }}
        uses: actions/upload-artifact@v4
        with:
          name: handytested-phase5-citation-backup-${{ github.event.inputs.post_id }}
          path: handytested-phase5-citation-backup-${{ github.event.inputs.post_id }}/
          retention-days: 30
