name: HandyTested - Phase 2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect, dry-run, apply, or refresh-home"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - dry-run
          - apply
          - refresh-home

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect WordPress design surfaces
        if: ${{ github.event.inputs.mode == 'inspect' }}
        env:
          HT_WP_PASS: ${{ secrets.HT_WP_PASS }}
        run: python handytested_phase2_inspect.py
      - name: Review or apply redesign
        if: ${{ github.event.inputs.mode != 'inspect' }}
        env:
          HT_WP_PASS: ${{ secrets.HT_WP_PASS }}
          MODE: ${{ github.event.inputs.mode }}
          BACKUP_DIR: handytested-phase2-backup
        run: python handytested_phase2.py
      - name: Preserve original WordPress objects
        if: ${{ always() && (github.event.inputs.mode == 'apply' || github.event.inputs.mode == 'refresh-home') }}
        uses: actions/upload-artifact@v4
        with:
          name: handytested-phase2-backup
          path: handytested-phase2-backup/
          retention-days: 30
