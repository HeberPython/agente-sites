name: HandyTested Revenue Agent — Qualified Buyers

on:
  schedule:
    - cron: "0 13 * * 1"   # Monday 10:00 America/Sao_Paulo
  workflow_dispatch:

jobs:
  revenue-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run qualified-buyer revenue cycle
        env:
          OPENAI_API_KEY:   ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL:     ${{ secrets.OPENAI_MODEL }}
          HT_WP_PASS:       ${{ secrets.HT_WP_PASS }}
          HT_AMAZON_TAG:    ${{ secrets.HT_AMAZON_TAG }}
          HT_AMAZON_DOMAIN: www.amazon.com
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSPLASH_KEY:     ${{ secrets.UNSPLASH_KEY }}
          HT_WP_RETRIES:    8
          HT_POST_STATUS:   draft
          HT_REVENUE_FIRST: "1"
        run: python pub_ht_pro.py
